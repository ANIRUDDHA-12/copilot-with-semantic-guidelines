version: '3.8'

services:
  postgres-ai:
    image: pgvector/pgvector:pg16
    container_name: copilot_db
    environment:
      - POSTGRES_USER=dba_admin
      - POSTGRES_PASSWORD=secure_copilot_pass123
      - POSTGRES_DB=enterprise_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  